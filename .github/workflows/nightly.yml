# T2-110 (REQ-TEST-004): the Simulation Spec §15.3 outcome bands over 50
# seeds each. Too slow for every push, so they run nightly and on demand;
# the band files themselves are parsed by the normal test run. T3-011: the
# scripted files must reject no command; the two AI-driven files run twice
# and must reject the same commands on the same ticks in every seed.
name: nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  bands:
    name: scenario bands (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Run the bands (50 seeds each)
        run: cargo test --release -p il_tests --test scenarios -- --ignored --nocapture

      # T2-101 (REQ-SAVE-005): record a full AI-versus-AI battle and verify
      # its replay by re-simulation on eight threads. Nothing binary is
      # committed; this is the `tests/replays/` of TDD §17.
      - name: Record and verify a replay
        run: |
          cargo run --release -p il_cli -- autoresolve tests/scenarios/ai_skirmish_300.json5 --record-replay target/nightly.ilrp
          cargo run --release -p il_cli -- replay target/nightly.ilrp --verify --threads 8

      # T3-070 (REQ-SAVE-005, Phase 3 exit criterion): the 20k fight recorded
      # to its end, verified on eight threads, and its final hash compared
      # with a fresh run of the same file to the same tick. `--ai none` keeps
      # the file's scripted attacker (two engine armies never meet on this
      # map, SAD T-15). About half an hour on the runner.
      - name: Record, verify and re-run the 20k fight
        shell: pwsh
        run: |
          cargo run --release -p il_cli -- autoresolve tests/scenarios/large/perf_20k.json5 --ai none --threads 8 --record-replay target/nightly_20k.ilrp --json target/nightly_20k.json
          if ($LASTEXITCODE -ne 0) { throw "autoresolve failed or the battle did not end" }
          $verify = cargo run --release -p il_cli -- replay target/nightly_20k.ilrp --verify --threads 8
          if ($LASTEXITCODE -ne 0) { throw "the 20k replay did not verify: $verify" }
          Write-Output $verify
          $ticks = [int](($verify | Select-String '^verified (\d+) ticks$').Matches[0].Groups[1].Value)
          $recorded = ($verify | Select-String '^final hash ([0-9a-f]{16})$').Matches[0].Groups[1].Value
          cargo run --release -p il_cli -- run tests/scenarios/large/perf_20k.json5 --ticks $ticks --hash-every $ticks --threads 8 --hash-log target/nightly_20k.hashlog
          if ($LASTEXITCODE -ne 0) { throw "the second run failed" }
          $line = (Get-Content target/nightly_20k.hashlog | Select-Object -Last 1)
          Write-Output "second run: $line"
          if ($line -ne "$ticks,$recorded") { throw "final hash differs: recorded $recorded, second run $line" }
