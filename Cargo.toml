[workspace]
members = ["crates/*", "game/rules", "tests", "benches"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"          # MSRV: bevy_ecs 0.19 needs 1.95; bumped only at phase boundaries
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Phase 0 pins (TDD §1.2). Upgrade only at phase boundaries (SAD T-1).
bevy_ecs = { version = "0.19.1", features = ["multi_threaded"] }
bevy_tasks = "0.19.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "1.3"                  # scenario files only; il_data has its own parser (T1-020)
semver = "1"
jsonschema = { version = "0.53", default-features = false }
notify = "8.2"
postcard = { version = "1.1", features = ["use-std"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
criterion = "0.8.2"           # benches only (T1-031, T1-080)
# Phase 1 pins (T1-050, TDD §1.2): the newest mutually compatible trio on 2026-09-03.
wgpu = "30.0.1"
winit = "0.30.13"
egui = "0.36.1"
egui-wgpu = { version = "0.36.1", features = ["winit"] }
egui-winit = { version = "0.36.1", default-features = false }
glam = "0.33.6"
png = "0.18.1"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
# Workspace crates
il_core = { path = "crates/il_core" }
il_data = { path = "crates/il_data" }
il_ai = { path = "crates/il_ai" }
il_sim_battle = { path = "crates/il_sim_battle" }
il_sim_campaign = { path = "crates/il_sim_campaign" }
il_save = { path = "crates/il_save" }
il_cli = { path = "crates/il_cli" }
il_render = { path = "crates/il_render" }
il_ui = { path = "crates/il_ui" }

[workspace.lints.clippy]
float_arithmetic = "deny"       # re-allowed only inside il_core::scalar

[workspace.lints.rust]
unsafe_code = "forbid"          # il_render and il_app carry their own [lints] tables (Phase 1)

# Debug builds run the 10,000-tick determinism test; optimise dependencies
# (bevy_ecs) so it takes seconds, keep our own crates debuggable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
# never: -C target-cpu=native, never fast-math (REQ-TECH-010)
