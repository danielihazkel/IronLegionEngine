# Overrides the workspace clippy.toml: this crate may use the filesystem
# (loading at startup, writing logs and snapshots). Wall-clock stays banned
# so nothing time-dependent leaks into data that reaches the sim.

disallowed-methods = [
  { path = "std::time::Instant::now", reason = "SIM-DET-006: no wall-clock in anything that feeds the sim" },
  { path = "std::time::SystemTime::now", reason = "SIM-DET-006: no wall-clock in anything that feeds the sim" },
]
