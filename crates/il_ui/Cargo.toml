[package]
name = "il_ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "egui panels, input mapping to Commands, selection model"

[dependencies]
il_core.workspace = true
il_data.workspace = true
il_sim_battle.workspace = true
egui.workspace = true
egui-winit.workspace = true
# Direct so `cargo test -p il_ui` unifies winit's rwh_06 feature like il_app does.
winit.workspace = true
glam.workspace = true

[dev-dependencies]
json5.workspace = true   # scenario setups in tests

# Not `workspace = true`: screen-space gesture math is float math on the app
# side of the sim boundary (TDD §11). Unsafe stays forbidden.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
float_arithmetic = "allow"
