[package]
name = "il_app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Iron Legion application shell: window, fixed-step loop, render and UI wiring"

[dependencies]
il_core.workspace = true
il_data.workspace = true
il_sim_battle.workspace = true
il_render.workspace = true
il_ui.workspace = true
il_cli.workspace = true
egui.workspace = true
winit.workspace = true
glam.workspace = true
clap.workspace = true
anyhow.workspace = true

[features]
default = ["dev"]
# Developer tooling: profiler overlay (T1-060); debug overlays and hot reload
# join it in T1-054 and T1-025. Release packaging builds --no-default-features.
dev = ["il_data/hot-reload"]

# Not `workspace = true`: the frame accumulator is wall-clock float math on the
# app side of the sim boundary (SAD §6.1, TDD §15). Unsafe stays forbidden.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
float_arithmetic = "allow"
