# Overrides the workspace clippy.toml: the editor may use the filesystem (it
# saves maps into a mod folder, SAD §5.2). Wall-clock stays banned so nothing
# time-dependent leaks into the files the sim later loads.

disallowed-methods = [
  { path = "std::time::Instant::now", reason = "SIM-DET-006: no wall-clock in anything that feeds the sim" },
  { path = "std::time::SystemTime::now", reason = "SIM-DET-006: no wall-clock in anything that feeds the sim" },
]
